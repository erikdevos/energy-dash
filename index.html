<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energiedashboard</title>
    <script>
      // gekozen thema meteen toepassen, zodat er geen flits is bij het laden
      try {
        var t = localStorage.getItem('energy-dash:thema');
        if (t === 'licht') document.documentElement.setAttribute('data-theme', 'light');
        else if (t === 'donker') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
